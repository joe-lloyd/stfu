<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>stfu</title>
    <style>
      html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; user-select: none; }
      #pill {
        position: absolute; inset: 0;
        display: flex; align-items: center; gap: 10px;
        padding: 0 14px 0 12px;
        border-radius: 999px;
        background: rgba(18, 18, 22, 0.94);
        box-shadow: 0 8px 28px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.06);
        transform-origin: 50% 100%;
        animation: pop 220ms cubic-bezier(.2,.9,.3,1.2) both;
      }
      #pill.done { animation: pop 220ms cubic-bezier(.2,.9,.3,1.2) both, fade 300ms ease-in 650ms both; }
      #light {
        width: 9px; height: 9px; border-radius: 50%; flex: none;
        background: #ff4d4f; box-shadow: 0 0 10px 2px rgba(255,77,79,0.55);
        transition: background 250ms, box-shadow 250ms;
        animation: breathe 1.4s ease-in-out infinite;
      }
      #pill.idle #light { animation: none; }
      #pill.processing #light { background: #f5c542; box-shadow: 0 0 10px 2px rgba(245,197,66,0.55); animation: breathe 0.7s ease-in-out infinite; }
      #pill.done #light { background: #3ddc84; box-shadow: 0 0 14px 4px rgba(61,220,132,0.6); animation: none; }
      #pill.error #light { background: #ff4d4f; animation: blink 0.35s steps(2) 4; }
      /* The wave's bars move by transform only, on the GPU: no layout or repaint per frame (main.ts). */
      #wave { flex: 1; height: 100%; position: relative; overflow: hidden; }
      #strip { position: absolute; inset: 0; will-change: transform; }
      #strip i {
        position: absolute; top: 7.5%; height: 85%; left: calc(var(--x, 0px) + 1.25px); width: var(--bar, 2px);
        border-radius: 999px; background: #8fd6ff; transform: scaleY(.06); will-change: transform;
      }
      #pill.processing #strip i { background: #f5c542; }
      #pill.done #strip i { background: #3ddc84; }
      /* "processing": a wave travels left to right; the strip swells it in from flat. */
      #pill.processing #strip { animation: swell 300ms ease-out both; }
      #pill.processing #strip i { animation: think 600ms ease-in-out calc(var(--i, 0) * 57ms - 2s) infinite alternate both; }
      @keyframes think { from { transform: scaleY(.15) } to { transform: scaleY(.9) } }
      @keyframes swell { from { transform: scaleY(.2) } to { transform: none } }
      /* "done": the bars settle to dots. */
      #pill.done #strip i { transition: transform 250ms ease-out; }
      /* "done": a ripple runs out from the centre of the wave. */
      #wave::after { content: ""; position: absolute; left: 50%; top: 50%; width: 12px; height: 8px; transform: translate(-50%, -50%); box-sizing: border-box; border: 2px solid #3ddc84; border-radius: 50%; opacity: 0; pointer-events: none; }
      #pill.done #wave::after { animation: ripple 450ms ease-out both; }
      /* Grows in size, not scale, so the ring stays 2px and ends inside the wave. */
      @keyframes ripple { from { width: 12px; height: 8px; opacity: .9 } to { width: 100%; height: calc(100% - 4px); opacity: 0 } }
      #msg { display: none; flex: none; max-width: 150px; color: #ffb3b3; font: 500 11px -apple-system, system-ui, "Segoe UI", sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #pill.error #msg { display: block; }
      #pill.error #wave { display: none; }
      /* "done" with a note (text left on the clipboard): say so, and stay long enough to read. */
      #pill.done.note { animation: pop 220ms cubic-bezier(.2,.9,.3,1.2) both, fade 300ms ease-in 1800ms both; }
      #pill.done.note #msg { display: block; flex: 1; max-width: none; text-align: center; color: #9ff0c0; }
      #pill.done.note #wave { display: none; }
      @keyframes breathe { 0%,100% { transform: scale(1); opacity: 1 } 50% { transform: scale(1.25); opacity: .75 } }
      @keyframes blink { from { opacity: 1 } to { opacity: .2 } }
      @keyframes pop { from { transform: translateY(8px) scale(.9); opacity: 0 } to { transform: none; opacity: 1 } }
      @keyframes fade { to { transform: translateY(6px) scale(.96); opacity: 0 } }
    </style>
  </head>
  <body>
    <div id="pill" class="idle">
      <div id="light"></div>
      <div id="wave"><div id="strip"></div></div>
      <div id="msg"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
