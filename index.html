<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>stfu</title>
    <style>
      html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; user-select: none; }
      #pill {
        position: absolute; inset: 0;
        display: flex; align-items: center; gap: 10px;
        padding: 0 14px 0 12px;
        border-radius: 999px;
        background: rgba(18, 18, 22, 0.94);
        box-shadow: 0 8px 28px rgba(0,0,0,0.45), inset 0 0 0 1px rgba(255,255,255,0.06);
        transform-origin: 50% 100%;
        animation: pop 220ms cubic-bezier(.2,.9,.3,1.2) both;
      }
      #pill.done { animation: pop 220ms cubic-bezier(.2,.9,.3,1.2) both, fade 300ms ease-in 650ms both; }
      #light {
        width: 9px; height: 9px; border-radius: 50%; flex: none;
        background: #ff4d4f; box-shadow: 0 0 10px 2px rgba(255,77,79,0.55);
        transition: background 250ms, box-shadow 250ms;
        animation: breathe 1.4s ease-in-out infinite;
      }
      #pill.processing #light { background: #f5c542; box-shadow: 0 0 10px 2px rgba(245,197,66,0.55); animation: breathe 0.7s ease-in-out infinite; }
      #pill.done #light { background: #3ddc84; box-shadow: 0 0 14px 4px rgba(61,220,132,0.6); animation: none; }
      #pill.error #light { background: #ff4d4f; animation: blink 0.35s steps(2) 4; }
      #wave { flex: 1; height: 100%; }
      #msg { display: none; flex: none; max-width: 150px; color: #ffb3b3; font: 500 11px -apple-system, system-ui, "Segoe UI", sans-serif; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #pill.error #msg { display: block; }
      #pill.error #wave { display: none; }
      @keyframes breathe { 0%,100% { transform: scale(1); opacity: 1 } 50% { transform: scale(1.25); opacity: .75 } }
      @keyframes blink { from { opacity: 1 } to { opacity: .2 } }
      @keyframes pop { from { transform: translateY(8px) scale(.9); opacity: 0 } to { transform: none; opacity: 1 } }
      @keyframes fade { to { transform: translateY(6px) scale(.96); opacity: 0 } }
    </style>
  </head>
  <body>
    <div id="pill">
      <div id="light"></div>
      <canvas id="wave"></canvas>
      <div id="msg"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
