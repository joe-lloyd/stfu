# Builds installers for macOS (universal), Windows (x64) and Linux (x64) and attaches them to a
# GitHub Release. Runs on every v* tag, and can be started by hand from the Actions tab.
#
# Runners: GitHub-hosted. `runs-on` is the only thing to change to move a job onto a self-hosted
# lab machine (e.g. `[self-hosted, macos]`) once one is registered as a GitHub Actions runner.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: universal-apple-darwin
            args: --target universal-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux build dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libxdo-dev libx11-dev libxi-dev libxtst-dev libssl-dev

      - run: pnpm install --frozen-lockfile --ignore-scripts

      # Sign macOS builds with the same self-signed "stfu Dev Signing" certificate every release.
      # Not a Developer ID (Gatekeeper still needs install.sh to clear quarantine), but a stable
      # identity is what keeps the Accessibility / Input Monitoring / Microphone grants across
      # updates: TCC keys them on the code-signing requirement.
      - name: Import signing certificate (macOS)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/build.keychain-db"; KCPW="$(openssl rand -hex 16)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          security default-keychain -s "$KC"
          # Self-signed: trust it for code signing on this runner or codesign refuses the chain.
          openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -nokeys -legacy -out "$RUNNER_TEMP/cert.pem" 2>/dev/null \
            || openssl pkcs12 -in "$RUNNER_TEMP/cert.p12" -passin "pass:$APPLE_CERTIFICATE_PASSWORD" -nokeys -out "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k "$KC" "$RUNNER_TEMP/cert.pem"
          security find-identity -v -p codesigning "$KC"
          rm -f "$RUNNER_TEMP/cert.p12"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater artifact signatures (latest.json + .sig files).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'manual-build' }}
          releaseName: stfu ${{ github.ref_type == 'tag' && github.ref_name || 'manual build' }}
          releaseBody: |
            ## Install in one command

            The builds are unsigned, so each installer also clears the download quarantine
            (Gatekeeper on macOS, SmartScreen mark-of-the-web on Windows) before running.

            **macOS** (universal, Apple Silicon + Intel)
            ```sh
            curl -fsSL https://raw.githubusercontent.com/joe-lloyd/stfu/main/scripts/install.sh | sh
            ```

            **Windows** (x64, PowerShell)
            ```powershell
            irm https://raw.githubusercontent.com/joe-lloyd/stfu/main/scripts/install.ps1 | iex
            ```

            **Linux** (x64 AppImage, best-effort)
            ```sh
            curl -fsSL https://raw.githubusercontent.com/joe-lloyd/stfu/main/scripts/install.sh | sh
            ```

            Pin this exact version with `STFU_VERSION=${{ github.ref_name }}` (`$env:STFU_VERSION` on Windows).
            Hotkey: hold **Fn** on macOS, **Ctrl+Win** on Windows. Keys for speech-to-text and clean-up go in Settings (tray icon).
          releaseDraft: false
          prerelease: ${{ github.ref_type != 'tag' }}
          args: ${{ matrix.args }}
