<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>stfu settings</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body { margin: 0; background: #16161a; color: #e8e8ec; font: 13px/1.45 -apple-system, system-ui, "Segoe UI", sans-serif; user-select: none; }
      main { padding: 20px 24px 24px; max-width: 560px; }
      h1 { font-size: 16px; margin: 0 0 4px; }
      .sub { color: #9a9aa5; margin: 0 0 18px; }
      section { background: #1f1f25; border: 1px solid #2c2c34; border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
      h2 { font-size: 13px; margin: 0 0 10px; display: flex; align-items: center; justify-content: space-between; }
      label { display: block; color: #b9b9c4; font-size: 12px; margin: 10px 0 4px; }
      input, select { width: 100%; padding: 7px 9px; background: #121216; color: #f0f0f4; border: 1px solid #34343e; border-radius: 6px; font: inherit; user-select: text; }
      input:focus, select:focus { outline: none; border-color: #7dd3fc; }
      .row { display: flex; gap: 8px; align-items: center; }
      .row > input { flex: 1; }
      button { padding: 7px 12px; border-radius: 6px; border: 1px solid #3a3a45; background: #2a2a33; color: #f0f0f4; font: inherit; cursor: pointer; white-space: nowrap; }
      button:hover { background: #34343f; }
      button.primary { background: #7dd3fc; color: #0b1620; border-color: #7dd3fc; font-weight: 600; }
      button.primary:hover { background: #93dcfd; }
      button.link { background: transparent; border-color: transparent; color: #7dd3fc; padding: 0; }
      button:disabled { opacity: 0.5; cursor: default; }
      .status { min-height: 18px; font-size: 12px; margin-top: 8px; color: #9a9aa5; }
      .status.ok { color: #3ddc84; }
      .status.err { color: #ff6b6b; }
      .toggle { display: flex; align-items: center; gap: 8px; font-size: 12px; color: #b9b9c4; }
      .toggle input { width: auto; }
      footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 6px; }
      code { background: #121216; padding: 1px 5px; border-radius: 4px; font-size: 12px; }
      .hint { color: #7f7f8a; font-size: 11px; margin-top: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>stfu</h1>
      <p class="sub">Hold <code id="hotkey">Fn</code>, talk, release. Two keys are needed, both take a minute to get.</p>

      <section>
        <h2>1. Speech to text <button class="link" id="stt-getkey">Get a key ↗</button></h2>
        <label>Provider</label>
        <select id="stt-provider">
          <option value="groq">Groq · whisper-large-v3-turbo (fast, cheap)</option>
          <option value="openai">OpenAI · whisper-1</option>
          <option value="custom">Custom OpenAI-compatible endpoint</option>
        </select>
        <div id="stt-custom" hidden>
          <label>Base URL</label>
          <input id="stt-url" placeholder="https://host/v1" />
          <label>Model</label>
          <input id="stt-model" placeholder="whisper-1" />
        </div>
        <label>API key</label>
        <div class="row">
          <input id="stt-key" type="password" placeholder="Paste your key here" autocomplete="off" />
          <button id="stt-show" title="Show/hide">👁</button>
          <button id="stt-test">Test</button>
        </div>
        <div class="status" id="stt-status"></div>
      </section>

      <section>
        <h2>2. Clean-up model <button class="link" id="llm-getkey">Get a key ↗</button></h2>
        <label class="toggle"><input type="checkbox" id="llm-enabled" /> Clean up the transcript with an LLM (remove ums, fix punctuation, bullet lists)</label>
        <label>Provider</label>
        <select id="llm-provider">
          <option value="zen">OpenCode Zen (free models)</option>
          <option value="openai">OpenAI</option>
          <option value="groq">Groq</option>
          <option value="ollama">Ollama (local, no key)</option>
          <option value="custom">Custom OpenAI-compatible endpoint</option>
        </select>
        <div id="llm-custom" hidden>
          <label>Base URL</label>
          <input id="llm-url" placeholder="https://host/v1" />
        </div>
        <label>Model</label>
        <input id="llm-model" list="llm-models" placeholder="model id" />
        <datalist id="llm-models"></datalist>
        <div class="hint" id="llm-hint"></div>
        <label>API key</label>
        <div class="row">
          <input id="llm-key" type="password" placeholder="Paste your key here" autocomplete="off" />
          <button id="llm-show" title="Show/hide">👁</button>
          <button id="llm-test">Test</button>
        </div>
        <div class="status" id="llm-status"></div>
      </section>

      <footer>
        <div class="status" id="save-status"></div>
        <button class="primary" id="save">Save</button>
      </footer>
      <p class="hint">Keys are stored in <code id="cfgpath"></code>. Hotkey changes need an app restart.</p>
    </main>
    <script type="module" src="/src/settings.ts"></script>
  </body>
</html>
