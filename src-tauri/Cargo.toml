[package]
name = "stfu"
version = "0.1.2"
description = "Hold a key, talk, get clean text pasted where your cursor is."
edition = "2021"

[lib]
name = "stfu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "native-tls", "http2"] }
cpal = "0.18"
hound = "3.5"
arboard = "3"
dirs = "7"
anyhow = "1"
log = "0.4"
env_logger = "0.11"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
rdev = "0.5"
enigo = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
